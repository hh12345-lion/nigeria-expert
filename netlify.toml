[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Single-hop canonical host (avoids redirect chains with middleware)
[[redirects]]
  from = "http://nigeriaexpert.com/*"
  to = "https://www.nigeriaexpert.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://nigeriaexpert.com/*"
  to = "https://www.nigeriaexpert.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.nigeriaexpert.com/*"
  to = "https://www.nigeriaexpert.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"
